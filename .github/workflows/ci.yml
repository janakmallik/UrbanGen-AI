name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (CPU torch)
        run: |
          uv sync --extra dev
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Lint with ruff
        run: uv run ruff check src/ scripts/ tests/

      - name: Run unit tests
        run: uv run pytest -v || [ $? -eq 5 ]