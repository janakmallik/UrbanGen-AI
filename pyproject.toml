[project]
name = "urbangen"
version = "0.1.0"
description = "Synthetic urban-scene generation via class-conditional generative models from scratch, evaluated against UrbanMind-AI's published baselines."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Janak Mallik" }]

dependencies = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "pillow>=10.4,<12",
    "scikit-learn>=1.5,<2",
    "mlflow>=2.16,<4",
    "tqdm>=4.66,<5",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "opencv-python>=4.11.0.86",
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.8.1",
    "gradio-client>=2.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urbangen"]

# --- THIS IS THE NEW PART ---
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]
# --- END NEW PART ---

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
